name: Keep warm

# Vercel Hobby(無料)プランのサーバーレス関数は、一定時間アクセスが無いとスリープし、
# 次回アクセス時にコールドスタート(数秒の遅延)が発生する。10分間隔で軽量な
# ヘルスチェックendpointを叩くことでこれを緩和する(効果を保証するものではない)。
#
# 事前準備: GitHubリポジトリの Settings > Secrets and variables > Actions で
# 変数(Variables)として APP_URL に、デプロイ後の実際のURL
# (例: https://your-app.vercel.app)を設定しておくこと。

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health check endpoint
        run: curl -fsS --max-time 15 "${{ vars.APP_URL }}/api/health"
